version: 2

# Composer and npm: version-update PRs are OFF (open-pull-requests-limit: 0). The first batch
# (10 Composer + 41 npm bumps, no advisory behind them) broke PHPStan/tsc and touched
# Inertia and all of Radix, which cannot be validated visually from CI. Security updates
# still arrive and audit.yml checks both lockfiles every week; bump a library by itself
# with the checks in Técnico/Runbook-verificar-un-despliegue. GitHub Actions bumps stay on
# because CI exercises them completely.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: 'chore(deps)'
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # rollup 4.64+ makes `vite build` take ~2 minutes (pinned with `overrides`).
      - dependency-name: rollup

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
