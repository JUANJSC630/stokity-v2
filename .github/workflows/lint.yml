name: linter

on:
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Pint (check only)
        run: vendor/bin/pint --test

      # Informational until the existing backlog is cleaned up
      # (42 files fail prettier and 4 eslint errors at the time of writing).
      - name: Prettier (check only)
        run: npx prettier --check "resources/" "*.{ts,json}"
        continue-on-error: true

      - name: ESLint (check only)
        run: npx eslint .
        continue-on-error: true
